[Rainmeter]
Update=2000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
OnRefreshAction=["#ROOTCONFIGPATH#Scripts\start_api.bat"]

[Variables]
FontName=Consolas
FontColor=0,255,120
DimColor=120,255,180
LineColor=0,255,120,50

; Layout base
ColLeftX=60
ColRightX=430
ColWidth=300
BarW=300
BarH=8


;=========================
; MEDIDAS
;=========================

[MeasureCPU]
Measure=Plugin
Plugin=WebParser
URL=file://#@#api.txt
ForceReload=1
UpdateRate=1
RegExp="(?si)CPU_USAGE=([0-9.]+)"
StringIndex=1
MinValue=0
MaxValue=100

[MeasureTemp]
Measure=Plugin
Plugin=WebParser
URL=file://#@#api.txt
ForceReload=1
UpdateRate=1
RegExp="(?si)CPU_TEMP=([0-9.]+)"
StringIndex=1

[MeasureRAM]
Measure=Plugin
Plugin=WebParser
URL=file://#@#api.txt
ForceReload=1
UpdateRate=1
RegExp="(?si)RAM_PERCENT=([0-9.]+)"
StringIndex=1
MinValue=0
MaxValue=100

[MeasureSwap]
Measure=Plugin
Plugin=WebParser
URL=file://#@#api.txt
ForceReload=1
UpdateRate=1
RegExp="(?si)SWAP_PERCENT=([0-9.]+)"
StringIndex=1

[MeasureDisk]
Measure=Plugin
Plugin=WebParser
URL=file://#@#api.txt
ForceReload=1
UpdateRate=1
RegExp="(?si)DISK_PERCENT=([0-9.]+)"
StringIndex=1
MinValue=0
MaxValue=100

[MeasureDiskUsed]
Measure=Plugin
Plugin=WebParser
URL=file://#@#api.txt
ForceReload=1
UpdateRate=1
RegExp="(?si)DISK_USED=([0-9.]+)"
StringIndex=1

[MeasureDiskTotal]
Measure=Plugin
Plugin=WebParser
URL=file://#@#api.txt
ForceReload=1
UpdateRate=1
RegExp="(?si)DISK_TOTAL=([0-9.]+)"
StringIndex=1

[MeasureIP]
Measure=Plugin
Plugin=WebParser
URL=file://#@#api.txt
ForceReload=1
UpdateRate=1
RegExp="(?si)IP=([0-9.]+)"
StringIndex=1

[MeasureDown]
Measure=Plugin
Plugin=WebParser
URL=file://#@#api.txt
ForceReload=1
UpdateRate=1
RegExp="(?si)DOWNLOAD=([0-9.]+)"
StringIndex=1

[MeasureUp]
Measure=Plugin
Plugin=WebParser
URL=file://#@#api.txt
ForceReload=1
UpdateRate=1
RegExp="(?si)UPLOAD=([0-9.]+)"
StringIndex=1


;=========================
; DIVISOR SUPERIOR
;=========================

[HeaderLine]
Meter=Shape
Shape=Rectangle 0,0,700,1 | Fill Color #LineColor# | StrokeWidth 0
X=40
Y=20


;=========================
; CPU (coluna esquerda)
;=========================

[CPU_Title]
Meter=String
Text=CPU
X=#ColLeftX#
Y=45
FontFace=#FontName#
FontSize=21
FontColor=#FontColor#
AntiAlias=1

[CPU_Value]
Meter=String
MeasureName=MeasureCPU
Text=%1%
X=(#ColLeftX#+#ColWidth#)
Y=45
W=#ColWidth#
StringAlign=Right
FontFace=#FontName#
FontSize=21
FontColor=#FontColor#
AntiAlias=1

[CPU_Bar]
Meter=Bar
MeasureName=MeasureCPU
X=#ColLeftX#
Y=82
W=#BarW#
H=6
BarOrientation=Horizontal
BarColor=0,255,120
SolidColor=30,60,45,50

[CPU_BarOutline]
Meter=Shape
Shape=Rectangle 0,0,#BarW#,6 | Fill Color 0,0,0,1 | StrokeWidth 1 | Stroke Color #LineColor#
X=#ColLeftX#
Y=82

[Temp]
Meter=String
MeasureName=MeasureTemp
Text=TEMP %1 C
X=#ColLeftX#
Y=104
FontFace=#FontName#
FontSize=16
FontColor=#DimColor#
AntiAlias=1


;=========================
; MEMORY (coluna direita)
;=========================

[Memory_Title]
Meter=String
Text=MEMORY
X=#ColRightX#
Y=45
FontFace=#FontName#
FontSize=21
FontColor=#FontColor#
AntiAlias=1

[RAM_Value]
Meter=String
MeasureName=MeasureRAM
Text=%1%
X=(#ColRightX#+#ColWidth#)
Y=45
W=#ColWidth#
StringAlign=Right
FontFace=#FontName#
FontSize=21
FontColor=#FontColor#
AntiAlias=1

[RAM_Bar]
Meter=Bar
MeasureName=MeasureRAM
X=#ColRightX#
Y=82
W=#BarW#
H=6
BarOrientation=Horizontal
BarColor=0,255,120
SolidColor=30,60,45,50

[RAM_BarOutline]
Meter=Shape
Shape=Rectangle 0,0,#BarW#,6 | Fill Color 0,0,0,1 | StrokeWidth 1 | Stroke Color #LineColor#
X=#ColRightX#
Y=82

[Swap]
Meter=String
MeasureName=MeasureSwap
Text=SWAP %1%
X=#ColRightX#
Y=104
FontFace=#FontName#
FontSize=16
FontColor=#DimColor#
AntiAlias=1

[MidLine]
Meter=Shape
Shape=Rectangle 0,0,700,1 | Fill Color #LineColor# | StrokeWidth 0
X=40
Y=140


;=========================
; STORAGE (coluna esquerda)
;=========================

[Storage_Title]
Meter=String
Text=STORAGE
X=#ColLeftX#
Y=165
FontFace=#FontName#
FontSize=21
FontColor=#FontColor#
AntiAlias=1

[Disk_Value]
Meter=String
MeasureName=MeasureDisk
Text=%1%
X=(#ColLeftX#+#ColWidth#)
Y=165
W=#ColWidth#
StringAlign=Right
FontFace=#FontName#
FontSize=21
FontColor=#FontColor#
AntiAlias=1

[Disk_Bar]
Meter=Bar
MeasureName=MeasureDisk
X=#ColLeftX#
Y=202
W=#BarW#
H=6
BarOrientation=Horizontal
BarColor=0,255,120
SolidColor=30,60,45,50

[Disk_BarOutline]
Meter=Shape
Shape=Rectangle 0,0,#BarW#,6 | Fill Color 0,0,0,1 | StrokeWidth 1 | Stroke Color #LineColor#
X=#ColLeftX#
Y=202

[Disk_Usage]
Meter=String
MeasureName=MeasureDiskUsed
MeasureName2=MeasureDiskTotal
Text=%1 / %2 GB
X=#ColLeftX#
Y=224
FontFace=#FontName#
FontSize=16
FontColor=#DimColor#
AntiAlias=1


;=========================
; NETWORK (coluna direita)
;=========================

[Network_Title]
Meter=String
Text=NETWORK
X=#ColRightX#
Y=165
FontFace=#FontName#
FontSize=21
FontColor=#FontColor#
AntiAlias=1

[IP]
Meter=String
MeasureName=MeasureIP
Text=%1
X=#ColRightX#
Y=202
FontFace=#FontName#
FontSize=16
FontColor=#DimColor#
AntiAlias=1

[Down]
Meter=String
MeasureName=MeasureDown
Text="DL %1 MB/s"
X=#ColRightX#
Y=228
FontFace=#FontName#
FontSize=17
FontColor=#FontColor#
AntiAlias=1

[Up]
Meter=String
MeasureName=MeasureUp
Text="UL %1 MB/s"
X=(#ColRightX#+150)
Y=228
FontFace=#FontName#
FontSize=17
FontColor=#FontColor#
AntiAlias=1

[FooterLine]
Meter=Shape
Shape=Rectangle 0,0,700,1 | Fill Color #LineColor# | StrokeWidth 0
X=40
Y=270


;=========================
; SERVICES
;=========================

[Services]
Meter=String
Text="*  FILEBROWSER ONLINE      *  TAILSCALE ONLINE"
X=390
Y=290
W=780
StringAlign=Center
FontFace=#FontName#
FontSize=17
FontColor=#FontColor#
AntiAlias=1
