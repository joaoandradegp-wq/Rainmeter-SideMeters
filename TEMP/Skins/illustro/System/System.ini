[Rainmeter]
Update=1000
Background=#@#Background.png
BackgroundMode=3
BackgroundMargins=0,34,0,14

[Metadata]
Name=System
Author=poiru / ChatGPT
Information=Displays system information.
Version=2.0

[Variables]
fontName=Trebuchet MS
textSize=8
colorBar=235,170,0,255
colorText=255,255,255,205

;------------------------------------------------
; SYSTEM MEASURES
;------------------------------------------------

[measureCPU]
Measure=CPU
Processor=0

[measureRAM]
Measure=PhysicalMemory
UpdateDivider=20

[measureRAMPercent]
Measure=Calc
Formula=(measureRAM / measureRAMTotal) * 100
DynamicVariables=1

[measureRAMUsed]
Measure=Calc
Formula=(measureRAM/1024/1024/1024)
DynamicVariables=1

[measureRAMTotal]
Measure=PhysicalMemory
Total=1
UpdateDivider=20

[measureRAMTotalGB]
Measure=Calc
Formula=(measureRAMTotal/1024/1024/1024)
DynamicVariables=1

[measureRAMFree]
Measure=Calc
Formula=((measureRAMTotal-measureRAM)/1024/1024/1024)
DynamicVariables=1

;------------------------------------------------
; STYLES
;------------------------------------------------

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,50
FontColor=#colorText#
FontFace=#fontName#
FontSize=10
AntiAlias=1
ClipString=1

[styleLeftText]
StringAlign=Left
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleRightText]
StringAlign=Right
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleBar]
BarColor=#colorBar#
BarOrientation=HORIZONTAL
SolidColor=255,255,255,15

[styleSeparator]
SolidColor=255,255,255,15

;------------------------------------------------
; TITLE
;------------------------------------------------

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=100
Y=12
W=190
H=18
Text=SYSTEM
LeftMouseUpAction=["taskmgr.exe"]
ToolTipText=Open Task Manager

;------------------------------------------------
; CPU
;------------------------------------------------

[meterLabelCPU]
Meter=String
MeterStyle=styleLeftText
X=10
Y=40
W=190
H=14
Text=CPU Usage

[meterValueCPU]
Meter=String
MeterStyle=styleRightText
MeasureName=measureCPU
X=200
Y=0r
W=190
H=14
Text=%1%

[meterBarCPU]
Meter=Bar
MeterStyle=styleBar
MeasureName=measureCPU
X=10
Y=52
W=190
H=1

;------------------------------------------------
; RAM
;------------------------------------------------

[meterLabelRAM]
Meter=String
MeterStyle=styleLeftText
X=10
Y=60
W=190
H=14
Text=RAM

[meterValueRAM]
Meter=String
MeterStyle=styleRightText
MeasureName=measureRAMPercent
X=200
Y=0r
W=190
H=14
NumOfDecimals=0
Text=%1%

[meterBarRAM]
Meter=Bar
MeterStyle=styleBar
MeasureName=measureRAM
X=10
Y=72
W=190
H=1

;------------------------------------------------
; AVAILABLE RAM
;------------------------------------------------

[meterLabelFree]
Meter=String
MeterStyle=styleLeftText
X=10
Y=80
W=190
H=14
Text=Available

[meterValueFree]
Meter=String
MeterStyle=styleRightText
MeasureName=measureRAMFree
X=200
Y=0r
W=190
H=14
NumOfDecimals=1
Text=%1 GB

[meterBarFree]
Meter=Bar
MeterStyle=styleBar
MeasureName=measureRAM
InvertMeasure=1
X=10
Y=92
W=190
H=1

;------------------------------------------------
; BOTTOM SEPARATOR
;------------------------------------------------

[meterSeparator]
Meter=Image
MeterStyle=styleSeparator
X=10
Y=104
W=190
H=1