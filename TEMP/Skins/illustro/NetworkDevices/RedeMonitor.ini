OnRefreshAction=["C:\Users\phobos\Documents\Rainmeter\Scripts\start_hidden.vbs"]

[Metadata]
Name=Network Devices
Author=Phobos
Version=FINAL-PERSISTENT

[Variables]
fontName=Trebuchet MS
textSize=8
colorText=255,255,255,205

[LuaScript]
