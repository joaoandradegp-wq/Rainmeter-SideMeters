; ----------------------------------
; NETWORK + LINK SPEED
; ----------------------------------

[Rainmeter]
Update=1000
Background=#@#Background.png
BackgroundMode=3
BackgroundMargins=0,34,0,14

OnRefreshAction=["wscript.exe" "#CURRENTPATH#RunLinkSpeed.vbs"]

[Metadata]
Name=Network
Author=poiru / ChatGPT
Information=Shows IP address, network activity and Ethernet Link Speed.
License=Creative Commons BY-NC-SA 3.0
Version=2.0

[Variables]
fontName=Trebuchet MS
textSize=8
colorBar=235,170,0,255
colorText=255,255,255,205

maxDownload=10485760
maxUpload=10485760

;================================================
; MEASURES
;================================================

[measureIP]
Measure=WebParser
URL=https://checkip.amazonaws.com/
UpdateRate=14400
RegExp=(?s)^(.*)$
StringIndex=1
Substitute="":"N/A"

[measureNetIn]
Measure=NetIn
NetInSpeed=#maxDownload#

[measureNetOut]
Measure=NetOut
NetOutSpeed=#maxUpload#

;================================================
; LINK SPEED
;================================================

[MeasureRun]
Measure=Calc
Formula=Counter % 60
IfEqualValue=0
IfEqualAction=["wscript.exe" "#CURRENTPATH#RunLinkSpeed.vbs"]

[MeasureLink]
Measure=Plugin
Plugin=WebParser
URL=file://#CURRENTPATH#linkspeed.txt
RegExp=(.*)
StringIndex=1
UpdateRate=5
DynamicVariables=1

;================================================
; STYLES
;================================================

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,50
FontColor=#colorText#
FontFace=#fontName#
FontSize=10
AntiAlias=1
ClipString=1

[styleLeftText]
StringAlign=Left
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleRightText]
StringAlign=Right
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleBar]
BarColor=#colorBar#
BarOrientation=HORIZONTAL
SolidColor=255,255,255,15

[styleSeperator]
SolidColor=255,255,255,15

;================================================
; TITLE
;================================================

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=100
Y=12
W=190
H=18
Text=Network

;================================================
; IP
;================================================

[meterIPLabel]
Meter=String
MeterStyle=styleLeftText
X=10
Y=40
W=190
H=14
Text=IP Address

[meterIPValue]
Meter=String
MeterStyle=styleRightText
MeasureName=measureIP
X=200
Y=0r
W=190
H=14
Text=%1

[meterSeperator]
Meter=Image
MeterStyle=styleSeperator
X=10
Y=52
W=190
H=1

;================================================
; UPLOAD
;================================================

[meterUploadLabel]
Meter=String
MeterStyle=styleLeftText
X=10
Y=60
W=190
H=14
Text=Upload

[meterUploadValue]
Meter=String
MeterStyle=styleRightText
MeasureName=measureNetOut
X=200
Y=0r
W=190
H=14
Text=%1B/s
NumOfDecimals=1
AutoScale=1

[meterUploadBar]
Meter=Bar
MeterStyle=styleBar
MeasureName=measureNetOut
X=10
Y=72
W=190
H=1

;================================================
; DOWNLOAD
;================================================

[meterDownloadLabel]
Meter=String
MeterStyle=styleLeftText
X=10
Y=80
W=190
H=14
Text=Download

[meterDownloadValue]
Meter=String
MeterStyle=styleRightText
MeasureName=measureNetIn
X=200
Y=0r
W=190
H=14
Text=%1B/s
NumOfDecimals=1
AutoScale=1

[meterDownloadBar]
Meter=Bar
MeterStyle=styleBar
MeasureName=measureNetIn
X=10
Y=92
W=190
H=1

;================================================
; LINK SPEED
;================================================

[meterLinkLabel]
Meter=String
MeterStyle=styleLeftText
X=10
Y=100
W=190
H=14
Text=Link Speed

[meterLinkValue]
Meter=String
MeterStyle=styleRightText
MeasureName=MeasureLink
X=200
Y=0r
W=190
H=14
Text=%1

[meterLinkSeparator]
Meter=Image
MeterStyle=styleSeperator
X=10
Y=112
W=190
H=1